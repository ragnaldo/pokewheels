<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#04122e">
  <meta name="description" content="Catálogo pessoal de Hot Wheels: fotografe, registre e organize sua coleção.">
  <title>PokeWheels — Catálogo de Hot Wheels</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-main">
      <a class="brand" href="#/galeria">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">Poke<strong>Wheels</strong></span>
      </a>
      <div class="topbar-actions">
        <button id="btn-busca" class="icon-btn" type="button" title="Buscar" aria-label="Buscar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <a href="#/ajustes" class="icon-btn" title="Ajustes" aria-label="Ajustes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/></svg>
        </a>
      </div>
    </div>
    <div id="barra-busca" class="searchbar" hidden>
      <input id="input-busca" type="search" placeholder="Buscar por modelo, série, cor, tag…" autocomplete="off">
      <button id="btn-limpar-busca" class="text-btn" type="button">Limpar</button>
    </div>
  </header>

  <main id="app" class="app" tabindex="-1"></main>

  <nav class="tabbar">
    <a href="#/galeria" data-tab="galeria">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>
      <span>Galeria</span>
    </a>
    <a href="#/catalogo" data-tab="catalogo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 015.5 4H11v16H5.5A1.5 1.5 0 014 18.5z"/><path d="M20 5.5A1.5 1.5 0 0018.5 4H13v16h5.5a1.5 1.5 0 001.5-1.5z"/></svg>
      <span>Catálogo</span>
    </a>
    <a href="#/novo" data-tab="novo" class="tab-cta" aria-label="Adicionar carrinho">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>Adicionar</span>
    </a>
    <a href="#/lotes" data-tab="lotes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      <span>Lotes</span>
    </a>
    <a href="#/ajustes" data-tab="ajustes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/></svg>
      <span>Ajustes</span>
    </a>
  </nav>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
