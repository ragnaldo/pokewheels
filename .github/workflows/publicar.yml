name: Catálogo e publicação

# Monta o catálogo a partir da Hot Wheels Fandom Wiki, guarda o resultado no
# repositório (para o app funcionar mesmo sem CI) e publica no GitHub Pages.
on:
  push:
    branches: [claude/hot-wheels-catalog-app-0ck8nl, main]
  schedule:
    - cron: '0 6 * * 1'   # toda segunda, 06:00 UTC
  workflow_dispatch:
    inputs:
      ano_inicial:
        description: 'Primeiro ano do catálogo'
        required: false
        default: '2005'
      amostra:
        description: 'Ano para inspecionar o HTML cru da wiki (diagnóstico)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    outputs:
      pages_ligado: ${{ steps.checar-pages.outputs.ligado }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Testar o parser da wiki
        run: node scripts/testar-parser.mjs

      - name: Inspecionar o HTML da wiki (diagnóstico)
        if: github.event.inputs.amostra != ''
        run: node scripts/amostra-wiki.mjs --ano=${{ github.event.inputs.amostra }} --linhas=8

      - name: Montar o catálogo a partir da wiki
        run: |
          node scripts/construir-catalogo.mjs \
            --de=${{ github.event.inputs.ano_inicial || '2005' }} \
            --ate=$(( $(date +%Y) + 1 ))

      - name: Conferir o que foi gerado
        run: |
          node -e "const i=require('./data/catalogo/index.json');
            if(!i.totalModelos || i.totalModelos < 500) {
              console.error('catálogo pequeno demais: ' + i.totalModelos); process.exit(1);
            }
            console.log(i.totalModelos + ' modelos em ' + i.anos.length + ' anos');"

      - name: Guardar o catálogo no repositório
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/catalogo
          if git diff --cached --quiet; then
            echo 'Catálogo sem mudanças.'
            exit 0
          fi
          TOTAL=$(node -e "console.log(require('./data/catalogo/index.json').totalModelos)")
          # o marcador impede que este commit dispare o workflow de novo
          git commit -m "Atualiza o catálogo da wiki ($TOTAL modelos) [skip ci]"
          # duas execuções podem terminar juntas: rebase e tenta de novo,
          # sempre mantendo o catálogo recém-gerado em caso de conflito
          for tentativa in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              echo "Catálogo publicado na tentativa $tentativa."
              exit 0
            fi
            git fetch origin "$BRANCH"
            git rebase -X theirs "origin/$BRANCH" || { git rebase --abort; exit 1; }
          done
          echo 'Não consegui publicar o catálogo depois de 3 tentativas.'
          exit 1

      - name: Ver se o GitHub Pages já está ligado
        id: checar-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo 'ligado=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ligado=false' >> "$GITHUB_OUTPUT"
            echo '::notice::O GitHub Pages ainda não está ligado neste repositório. Vá em Settings → Pages e escolha Source: GitHub Actions; o próximo deploy sai sozinho.'
          fi

      - name: Preparar o GitHub Pages
        if: steps.checar-pages.outputs.ligado == 'true'
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        if: steps.checar-pages.outputs.ligado == 'true'
        with:
          path: .

  publicar:
    needs: construir
    if: needs.construir.outputs.pages_ligado == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
